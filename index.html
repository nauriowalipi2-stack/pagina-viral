    <!-- ============================================== -->
    <!-- 2. REDIRECIONADOR ALEATÓRIO (CONTEÚDO VIRAL)  -->
    <!-- ============================================== -->
    <script>
        // LISTA DE URLs VIRAIS (VOCÊ PODE EDITAR À VONTADE)
        const urlsVirais = [
            "https://twitter.com/elonmusk/status/1755550844951974230",
            "https://twitter.com/NASA/status/1756660844951974231",
            "https://x.com/neymarjr/status/1758880844951974233",
            "https://twitter.com/espn/status/1757770844951974232",
            "https://x.com/BillGates/status/1759990844951974234"
        ];

        // ESCOLHE UMA URL ALEATÓRIA DA LISTA
        const urlDestino = urlsVirais[Math.floor(Math.random() * urlsVirais.length)];
        
        // MOSTRA NO CONSOLE QUAL URL FOI ESCOLHIDA (OPCIONAL)
        console.log("Redirecionando para: " + urlDestino);
    </script>

    <!-- ============================================== -->
    <!-- 3. SISTEMA DE COOKIE (RASTREAR VISITANTES)    -->
    <!-- ============================================== -->
    <script>
        // FUNÇÃO PARA CRIAR COOKIE
        function setCookie(name, value, days) {
            let expires = "";
            if (days) {
                const date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/";
        }

        // FUNÇÃO PARA LER COOKIE
        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        // VERIFICA SE O VISITANTE JÁ TEM COOKIE
        if (!getCookie('visitante_id')) {
            // SE NÃO TEM, CRIA UM ID ÚNICO
            const visitanteId = 'VISITANTE_' + Math.random().toString(36).substr(2, 9);
            setCookie('visitante_id', visitanteId, 30); // GUARDA POR 30 DIAS
            console.log('Novo visitante registrado: ' + visitanteId);
        } else {
            console.log('Visitante recorrente: ' + getCookie('visitante_id'));
        }
    </script>
